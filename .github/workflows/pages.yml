name: Publish Physics Lab to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stage public site files
        run: |
          mkdir public-site
          cp index.html login.html register.html auth.js session-nav.js supabase-config.js auth.css dashboard.html stage.html teacher.html lesson1.html lesson2.html styles.css app.js lesson.css 'مذكرة_الدرس_الأول_القياس_الفيزيائي.pdf' 'مذكرة_الفصل_الثاني_الدرس_الأول_الحركة_والسرعة.pdf' public-site/
      - name: Upload public site files only
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public-site/
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

